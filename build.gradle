plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        extreme_winter {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client { runDir "work/run-client-${project.minecraft_version}" }
        server { runDir "work/run-server-${project.minecraft_version}" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(26)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
tasks.withType(Jar).configureEach { includeEmptyDirs = false }
test {
    useJUnitPlatform()
    workingDir = file('work/unit-tests')
    doFirst { workingDir.mkdirs() }
}

fabricApi.configureTests {
    createSourceSet = true
    modId = 'extreme_winter_test'
    enableGameTests = false
    enableClientGameTests = true
    clearRunDirectory = false
}
dependencies {
    gametestImplementation fabricApi.module('fabric-client-gametest-api-v1', project.fabric_version)
}
loom.runs.clientGameTest { runDir "work/run-gametest-${project.minecraft_version}" }

// Optional test-only profiles. These files are never included in the distributable JAR.
def compatProfile = providers.gradleProperty('compatProfile').getOrElse('A')
if (!(compatProfile in ['A', 'B', 'C', 'D', 'E'])) throw new GradleException('compatProfile must be A, B, C, D or E')
def compatMods = []
if (compatProfile != 'A') compatMods += 'sodium'
if (compatProfile in ['C', 'D', 'E']) compatMods += 'iris'
if (compatProfile == 'E') compatMods += ['lithium', 'ferrite-core', 'modmenu', 'cloth-config']
dependencies {
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    productionRuntimeMods fabricApi.module('fabric-client-gametest-api-v1', project.fabric_version)
    compatMods.each { mod -> productionRuntimeMods fileTree(dir: "work/compat/${project.minecraft_version}/${mod}", include: '*.jar') }
}
tasks.register('gametestJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = 'gametest'
    destinationDirectory = layout.buildDirectory.dir('testmods')
}
tasks.register('runProductionGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(tasks.named('gametestJar'))
    runDir = file("work/run-production-${project.minecraft_version}-${compatProfile}")
    jvmArgs.addAll('-Dfabric.client.gametest', "-Dwinter.test.profile=${compatProfile}",
            "-Dfabric.client.gametest.testModResourcesPath=${file('src/gametest/resources').absolutePath}")
    programArgs.addAll('--username', 'Player0', '--version', project.minecraft_version, '--accessToken', '0')
}
